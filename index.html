<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerien Hotel - Pi Network</title>
    <!-- تضمين مكتبة Pi SDK -->
    <script src="https://minepi.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background-color: #673ab7; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:disabled { background-color: #ccc; }
        .status { margin-top: 15px; color: #555; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>تطبيق الفنادق الجزائرية</h1>
        <p>احجز غرفتك وادفع بواسطة <b>Pi Testnet</b></p>
        <hr>
        <h3>فندق الأوراسي</h3>
        <p>السعر: 0.1 Pi / ليلة</p>
        
        <!-- زر تسجيل الدخول -->
        <button id="loginBtn">تسجيل الدخول بـ Pi</button>
        
        <!-- زر الدفع (يكون معطلاً حتى تسجيل الدخول) -->
        <button id="payButton" style="display:none;">تأكيد الحجز والدفع</button>
        
        <div id="status" class="status">يرجى تسجيل الدخول أولاً</div>
    </div>

    <script>
        // 1. تهيئة تطبيق Pi (وضعية التست نت)
        Pi.init({ version: "2.0", sandbox: true });

        const loginBtn = document.getElementById('loginBtn');
        const payButton = document.getElementById('payButton');
        const statusText = document.getElementById('status');

        // 2. وظيفة تسجيل الدخول
        loginBtn.onclick = async () => {
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                statusText.innerText = "مرحباً: " + auth.user.username;
                loginBtn.style.display = "none";
                payButton.style.display = "inline-block";
            } catch (err) {
                statusText.innerText = "خطأ في تسجيل الدخول. حاول من Pi Browser.";
            }
        };

        // 3. وظيفة الدفع الكاملة المعدلة
        payButton.onclick = async () => {
            statusText.innerText = "جاري تحضير عملية الدفع...";
            
            try {
                const payment = await Pi.createPayment({
                    amount: 0.1, // القيمة للتجربة
                    memo: "حجز غرفة في فندق - الجزائر",
                    metadata: { hotelId: "hotel_001", days: 1 },
                }, {
                    onReadyForServerApproval: (paymentId) => {
                        statusText.innerText = "تم إرسال الطلب، بانتظار الموافقة...";
                        // ملاحظة: في بيئة Testnet، يمكنك استخدام هذه الرابط البرمجي (Webhook) للمحاكاة
                        console.log("Payment ID:", paymentId);
                        // هنا يتم إخبار السيرفر أن الدفع بدأ (للتجربة تجاوزها يدوياً)
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        statusText.innerText = "تم الدفع بنجاح! رقم العملية: " + txid;
                        alert("مبروك! تم تأكيد حجزك في الفندق بنجاح.");
                    },
                    onCancel: (paymentId) => {
                        statusText.innerText = "تم إلغاء عملية الدفع.";
                    },
                    onError: (error, payment) => {
                        statusText.innerText = "حدث خطأ: " + error.message;
                    },
                });
            } catch (err) {
                statusText.innerText = "فشل بدء الدفع: " + err.message;
            }
        };

        // معالجة المدفوعات العالقة (متطلب أساسي لـ Pi)
        function onIncompletePaymentFound(payment) {
            statusText.innerText = "لديك عملية دفع سابقة لم تكتمل.";
            // يمكنك هنا إرسال معرف الدفع (payment.identifier) لسيرفرك لإكمالها
        };
    </script>
</body>
</html>
